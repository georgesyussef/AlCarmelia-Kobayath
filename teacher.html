<style>
:root{--burg:#7b1238;--navy:#12365f;--gold:#d7ae45;--cream:#faf7ef;--ink:#172235;--muted:#718096;--line:#e6e9ef;--white:#fff;--danger:#b42318;--green:#16825d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f6f9;color:var(--ink)}
button,input,select,textarea{font:inherit}

.login-modal{position:fixed;inset:0;background:rgba(18,54,95,0.95);display:flex;align-items:center;justify-content:center;z-index:999;padding:15px}
.login-box{background:#fff;padding:35px 25px;border-radius:18px;width:min(400px,100%);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.2);position:relative}
.login-box img.logo{width: 220px; max-width: 80%; height: auto; object-fit: contain; margin-bottom: 15px;}
.login-box h2{margin:0 0 4px;color:var(--navy);font-size:22px}
.login-box p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
.login-box input{width:100%;padding:12px;border:1px solid #d8dde6;border-radius:10px;margin-bottom:12px;text-align:left;font-size:14px;outline:none}

.pw-wrap{position:relative;display:flex;align-items:center;margin-bottom:12px}
.pw-wrap input{margin-bottom:0!important;padding-right:40px!important}
.pw-toggle{position:absolute;right:12px;background:none;border:none;cursor:pointer;font-size:18px;padding:0;color:var(--muted)}

.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.btn-block{width:100%}
.primary{background:var(--burg);color:#fff}
.secondary{background:#eef2f7;color:var(--navy)}
.danger{background:#fff0ef;color:var(--danger)}

.container{max-width:950px;margin:0 auto;padding:20px 15px}
.header{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.header-brand{display:flex;align-items:center;gap:15px}
.header-brand img{width:55px;height:55px;object-fit:contain}
.header h1{margin:0;font-size:20px;color:var(--navy)}
.header p{margin:4px 0 0;color:var(--muted);font-size:13px}

.tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:5px}
.tab-btn{background:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--muted)}
.tab-btn.active{background:var(--burg);color:#fff;border-color:var(--burg)}

.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px;margin-bottom:15px}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef3fa;color:var(--navy)}
.badge.green{background:#e8f7f0;color:var(--green)}
.empty{text-align:center;padding:30px;color:var(--muted)}

.modal-bg{display:none;position:fixed;inset:0;background:#10182899;z-index:20;align-items:center;justify-content:center;padding:18px}
.modal-bg.show{display:flex}
.modal{width:min(520px,100%);background:#fff;border-radius:18px;padding:22px}
.modal h3{margin:0 0 16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #d8dde6;border-radius:10px;padding:9px 12px;outline:none}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.lang-switcher {
  background: #f0f4f8;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  cursor: pointer;
  outline: none;
}

      </div>
    </div>

    <div id="t_work" class="tab-content" style="display:none">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
          <h3 style="margin:0" id="workTitle">📖 Travail Quotidien (En classe)</h3>
          <button class="btn primary" id="addWorkBtn" onclick="openWorkModal()">＋ Ajouter Travail Quotidien</button>
        </div>
        <div class="date-test-toolbar" data-for="workList" style="display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:12px;margin:10px 0;background:#f4f6f9;border:1px solid #e6e9ef;border-radius:12px"><label style="font-size:13px;font-weight:650">📅 Date · Travail Quotidien</label><input aria-label="Date" type="date" id="filter_workList" style="border:1px solid #d8dde6;border-radius:9px;padding:8px"><button type="button" onclick="changeDateFilter('workList',-1)" style="padding:8px;border:1px solid #ddd;border-radius:8px;cursor:pointer">◀</button><button type="button" onclick="changeDateFilter('workList',1)" style="padding:8px;border:1px solid #ddd;border-radius:8px;cursor:pointer">▶</button><button type="button" onclick="resetDateFilter('workList')" style="padding:8px;border:1px solid #ddd;border-radius:8px;cursor:pointer">Aujourd'hui</button><button type="button" onclick="showAllDates('workList')" style="padding:8px;border:1px solid #ddd;border-radius:8px;cursor:pointer">Toutes les dates</button></div><div id="workList"></div>

        <div style="margin-bottom:15px">
          <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px" id="lblNewPw">Nouveau mot de passe</label>

</div>

function setText(id, text) { const el = document.getElementById(id); if (el && text !== undefined) el.innerText = text; }
function setPlaceholder(id, text) { const el = document.getElementById(id); if (el && text !== undefined) el.placeholder = text; }

function switchLanguage(lang) {
  localStorage.setItem('app_lang', lang);
  const t = translations[lang] || translations.fr;
  document.getElementById('htmlRoot').dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('htmlRoot').lang = lang;

  document.querySelectorAll('.lang-switcher').forEach(s => s.value = lang);

  setText('loginTitle', t.loginTitle);
  setText('loginSub', t.loginSub);
  setPlaceholder('teacherIdInput', t.idPlaceholder);
  setPlaceholder('teacherPinInput', t.pinPlaceholder);
  setText('loginBtn', t.loginBtn);
  setText('logoutBtn', t.logoutBtn);

  setText('tabAgenda', t.tabAgenda);
  setText('tabWork', t.tabWork);
  setText('tabSec', t.tabSec);

  setText('agendaTitle', t.agendaTitle);
  setText('addHomeworkBtn', t.addHomeworkBtn);
  setText('workTitle', t.workTitle);
  setText('addWorkBtn', t.addWorkBtn);

  setText('pwTitle', t.pwTitle);
  setText('lblOldPw', t.lblOldPw);
  setText('lblNewPw', t.lblNewPw);
  setText('btnChangePw', t.btnChangePw);

  if (currentTeacher) {
    document.getElementById('teacherNameDisplay').textContent = currentTeacher.name;
    document.getElementById('teacherSubjectDisplay').textContent = `${t.subjLabel} : ${currentTeacher.subject || 'Général'}`;
  }
}

firebase.initializeApp(firebaseConfig);
const firestore = firebase.firestore();

let currentTeacher = null;
let classesList = [];

function togglePass(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (inp.type === "password") { inp.type = "text"; btn.textContent = "🙈"; } 
  else { inp.type = "password"; btn.textContent = "👁️"; }
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function loginTeacher() {
  const rawInput = document.getElementById('teacherIdInput').value.trim();
  const pin = document.getElementById('teacherPinInput').value.trim();
  if(!rawInput || !pin) return alert("Veuillez remplir tous les champs.");

  firestore.collection("teachers").get().then((snap) => {
    const found = snap.docs.map(d => ({docId: d.id, ...d.data()})).find(t => 
      (t.docId.toLowerCase() === rawInput.toLowerCase() || (t.id && t.id.toString().trim().toLowerCase() === rawInput.toLowerCase())) &&
      String(t.pin || '1234').trim() === String(pin)
    );

    if (found) {
      carmeliaAttachmentLogin('teacher',rawInput,pin).catch(err=>console.warn('Attachment session unavailable:',err.message));
      currentTeacher = found;
      sessionStorage.setItem('teacher_id', found.docId || found.id);
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('teacherContent').style.display = 'block';
      initTeacherData();
    } else {
      alert("ID Enseignant ou Code PIN incorrect!");
    }
  }).catch(err => alert("Erreur: " + err.message));
}

function logoutTeacher() {
  carmeliaStopDateSubscriptions();
  sessionStorage.removeItem('carmelia_attachment_token');
  sessionStorage.removeItem('teacher_id');
  currentTeacher = null;
  document.getElementById('loginModal').style.display = 'flex';
  document.getElementById('teacherContent').style.display = 'none';
  document.getElementById('teacherIdInput').value = '';
  document.getElementById('teacherPinInput').value = '';
}


// Carmelia read optimization: date-scoped live queries, unsubscribe on date changes.
// IMPORTANT: existing YYYY-MM-DD string date fields must match exactly.
const carmeliaDateSubscriptions = {};
function carmeliaListenByDate(key, baseQuery, callback) {
  const existing = carmeliaDateSubscriptions[key];
  if (existing && existing.unsubscribe) existing.unsubscribe();
  const selected = carmeliaDateFilters[key];
  const query = selected ? baseQuery.where('date', '==', selected) : baseQuery;
  const unsubscribe = query.onSnapshot(callback, error => {
    console.error('Carmelia Firestore date query error:', key, error);
    const target = document.getElementById(key);
    if (target) target.textContent = 'Impossible de charger les données. Vérifiez les index Firestore et les autorisations.';
  });
  carmeliaDateSubscriptions[key] = {baseQuery, callback, unsubscribe};
}
function carmeliaStopDateSubscriptions() {
  for (const key of Object.keys(carmeliaDateSubscriptions)) {
    if (carmeliaDateSubscriptions[key].unsubscribe) carmeliaDateSubscriptions[key].unsubscribe();
    delete carmeliaDateSubscriptions[key];
  }
}
function carmeliaRefreshDateSubscription(key) {
  const current = carmeliaDateSubscriptions[key];
  if (current) carmeliaListenByDate(key, current.baseQuery, current.callback);
}

function checkSavedTeacher() {
  const savedId = sessionStorage.getItem('teacher_id');
  if(savedId) {
    firestore.collection("teachers").doc(savedId).get().then(doc => {
      if(doc.exists) {
        currentTeacher = doc.data();
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('teacherContent').style.display = 'block';
        initTeacherData();
      } else { logoutTeacher(); }
    });
  }
}

function initTeacherData() {
  const lang = localStorage.getItem('app_lang') || 'fr';
  const t = translations[lang] || translations.fr;

  document.getElementById('teacherNameDisplay').textContent = currentTeacher.name;
  document.getElementById('teacherSubjectDisplay').textContent = `${t.subjLabel} : ${currentTeacher.subject || 'Général'}`;

  firestore.collection("classes").get().then(snap => {
    classesList = snap.docs.map(d => d.data());
  });

  carmeliaListenByDate("agendaList", firestore.collection("agenda").where("teacherId", "==", currentTeacher.id), snap => {
    const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
    window.carmeliaCache = window.carmeliaCache || {}; list.forEach(x=>window.carmeliaCache[x.id]=x);
    window.carmeliaRender_agendaList = () => { document.getElementById('agendaList').innerHTML = filterBySelectedDate(list, 'agendaList').slice().reverse().map(a => `
      <div style="display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)">
        <div>
          <strong>${esc(a.title)}</strong> <span class="badge">${esc(a.type || 'Devoir')}</span>
          <div class="muted" style="font-size:12px;margin-top:3px">${esc(a.date)} · Classe: <strong>${esc(a.class)}</strong> · ${esc(a.subject)}</div>
          <div style="margin-top:5px;white-space:pre-wrap">${esc(a.details || '')}</div>
        </div>
        <button class="btn secondary" style="padding:6px 10px;font-size:12px" onclick="carmeliaEdit(\'agenda\',\'${a.id}\')">Modifier</button> <button class="btn danger" style="padding:6px 10px;font-size:12px" onclick="deleteDoc('agenda', '${a.id}')">Supprimer</button>
      </div>
    `).join('') || '<div class="empty">Aucun devoir publié.</div>'; }; window.carmeliaRender_agendaList();
  });

  carmeliaListenByDate("workList", firestore.collection("travail_quotidien").where("teacherId", "==", currentTeacher.id), snap => {
    const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
    window.carmeliaCache = window.carmeliaCache || {}; list.forEach(x=>window.carmeliaCache[x.id]=x);
    window.carmeliaRender_workList = () => { document.getElementById('workList').innerHTML = filterBySelectedDate(list, 'workList').slice().reverse().map(w => `
      <div style="display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)">
        <div>
          <strong>${esc(w.title || 'Travail en classe')}</strong> <span class="badge green">${esc(w.subject)}</span>
          <div class="muted" style="font-size:12px;margin-top:3px">${esc(w.date)} · Classe: <strong>${esc(w.class)}</strong></div>
          <div style="margin-top:5px;white-space:pre-wrap">${esc(w.details || '')}</div>
          ${carmeliaAttachmentHTML(w)}
        </div>
        <button class="btn secondary" style="padding:6px 10px;font-size:12px" onclick="carmeliaEdit(\'travail_quotidien\',\'${w.id}\')">Modifier</button> <button class="btn danger" style="padding:6px 10px;font-size:12px" onclick="deleteDoc('travail_quotidien', '${w.id}')">Supprimer</button>
      </div>
    `).join('') || '<div class="empty">Aucun travail quotidien publié.</div>'; }; window.carmeliaRender_workList();
  });
}

function openWorkModal() {

  let teacherSubjList = (currentTeacher.subject || '').split(',').map(s => s.trim()).filter(Boolean);

async function saveTeacherWork() {
  const title = document.getElementById('tw_title').value.trim();
  if (!title) return alert('Veuillez saisir un titre.');
  const file=document.getElementById('tw_attachment')?.files?.[0];
  const payload={date:document.getElementById('tw_date').value, class:document.getElementById('tw_class').value,
    subject:document.getElementById('tw_subject').value, title, details:document.getElementById('tw_details').value.trim(),
    teacher:currentTeacher.name, teacherId: currentTeacher.id};
  const btn=document.querySelector('#modalBg .btn.primary'); if(btn)btn.disabled=true;
  try {
    const ref=await firestore.collection('travail_quotidien').add(payload);
    if(file){
      try { const attachment=await carmeliaUploadAttachment(file,ref.id);await ref.update({attachment}); }
      catch(e){await ref.delete();throw e;}
    }
    closeModal();
    sendPushNotification('📖 Travail Quotidien - '+payload.class,payload.subject+': '+title);
  }catch(e){carmeliaError(e);}finally{if(btn)btn.disabled=false;}
}


// Firebase Storage upload helper; invoked only after validating a real TEST Firebase project.

function carmeliaAttachmentHTML(w){if(!w.attachment)return '';if(w.attachment.provider==='supabase')return '<div style="margin-top:8px"><button class="btn secondary" onclick="carmeliaOpenAttachment(\''+esc(w.docId||w.id||'')+'\')">📎 '+esc(w.attachment.name||'Fichier')+'</button></div>';if(w.attachment.url&&/^https:\/\//.test(w.attachment.url))return '<a target="_blank" rel="noopener" href="'+esc(w.attachment.url)+'">📎 '+esc(w.attachment.name||'Fichier')+'</a>';return '';}
function carmeliaError(e){alert('Erreur : '+(e && e.message ? e.message : String(e)));}


async function carmeliaEdit(col,id) {
 const x=window.carmeliaCache?.[id];if(!x)return alert('Document introuvable.');
 if(col==='agenda')openAgendaModal();else openWorkModal();
 const p=col==='agenda'?'ta':'tw';
 const put=(k,v)=>{const el=document.getElementById(p+'_'+k);if(el)el.value=v??'';};
 put('date',x.date);put('class',x.class);put('subject',x.subject);put('type',x.type);put('title',x.title);put('details',x.details);
 const actions=document.querySelector('#modalBg .modal-actions');
 const save=actions?.querySelector('.btn.primary');
 if(save)save.setAttribute('onclick',`carmeliaSaveEdit('${col}','${id}','${p}')`);
 const header=document.getElementById('modalTitle');if(header)header.textContent='Modifier '+(col==='agenda'?'Devoir':'Travail Quotidien');
 if(col==='travail_quotidien' && x.attachment?.name){
   const preview=document.getElementById(p+'_preview');if(preview)preview.textContent='Fichier actuel : '+x.attachment.name+' (conservé si aucun nouveau fichier)';
 }
}
async function carmeliaSaveEdit(col,id,p) {
 const x=window.carmeliaCache?.[id];if(!x)return alert('Document introuvable.');
 const get=k=>document.getElementById(p+'_'+k)?.value;
 const title=(get('title')||'').trim();if(!title)return alert('Veuillez saisir un titre.');
 const payload={date:get('date'),class:get('class'),subject:get('subject'),title,details:(get('details')||'').trim()};
 if(col==='agenda')payload.type=get('type');
 const file=col==='travail_quotidien'?document.getElementById(p+'_attachment')?.files?.[0]:null;
 const btn=document.querySelector('#modalBg .btn.primary');if(btn)btn.disabled=true;
 try{
   if(file)payload.attachment=await carmeliaUploadAttachment(file,id);
   await firestore.collection(col).doc(id).update(payload);
   closeModal();
 }catch(e){carmeliaError(e);}finally{if(btn)btn.disabled=false;}
}

function deleteDoc(col, id) {
  if (confirm("Voulez-vous supprimer cet élément ?")) {
    firestore.collection(col).doc(id).delete();
  }
}

function changeTeacherPassword() {
  const oldP = document.getElementById('oldTeacherPin').value.trim();
  const newP = document.getElementById('newTeacherPin').value.trim();
  if (!oldP || !newP) return alert("Veuillez remplir tous les champs.");

  if (String(currentTeacher.pin || '1234') !== oldP) return alert("Ancien mot de passe incorrect.");

  const docRefId = currentTeacher.docId || currentTeacher.id;
  firestore.collection("teachers").doc(docRefId).update({ pin: newP }).then(() => {
    currentTeacher.pin = newP;
    alert("Mot de passe modifié avec succès!");
    document.getElementById('oldTeacherPin').value = '';
    document.getElementById('newTeacherPin').value = '';
  });
}

function openModal(title, body){ document.getElementById('modalTitle').textContent = title; document.getElementById('modalContent').innerHTML = body; document.getElementById('modalBg').classList.add('show'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).style.display = 'block';
  btn.classList.add('active');
}

const savedLang = localStorage.getItem('app_lang') || 'fr';

<script>
// TEST ONLY: client-side date presentation; original Firebase queries, saves and permissions unchanged.
const carmeliaDateFilters = {agendaList: localDate(), workList: localDate()};
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function filterBySelectedDate(items,key){const date=carmeliaDateFilters[key];return date?items.filter(x=>String(x.date||'').slice(0,10)===date):items;}
function redrawDateFilter(key){const el=document.getElementById('filter_'+key);if(el)el.value=carmeliaDateFilters[key]||'';const list=document.getElementById(key);if(list&&list.dataset.cachedHtml){};
// Re-run existing Firestore listener rendering via a safe UI-only DOM filter for current content.
const root=document.getElementById(key);if(!root)return;
if(!root.dataset.originalHtml)root.dataset.originalHtml=root.innerHTML;
const cards=Array.from(root.children);cards.forEach(card=>{const t=card.textContent||'';const d=carmeliaDateFilters[key];card.style.display=(!d||t.includes(d))?'':'none';});
}
function setDateFilter(key,value){if(carmeliaDateFilters[key]===value)return;carmeliaDateFilters[key]=value;const el=document.getElementById('filter_'+key);if(el)el.value=value||'';
carmeliaRefreshDateSubscription(key);
const render=window['carmeliaRender_'+key];if(typeof render==='function')render();
}
function changeDateFilter(key,days){const v=carmeliaDateFilters[key]||localDate();const d=new Date(v+'T12:00:00');d.setDate(d.getDate()+days);setDateFilter(key,`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);}
function resetDateFilter(key){setDateFilter(key,localDate());}
function showAllDates(key){if(confirm('Afficher toutes les dates peut augmenter fortement les lectures Firebase. Continuer ?'))setDateFilter(key,'');}
document.addEventListener('change',e=>{if(e.target.id==='filter_agendaList')setDateFilter('agendaList',e.target.value);if(e.target.id==='filter_workList')setDateFilter('workList',e.target.value);});
document.addEventListener('DOMContentLoaded',()=>{for(const key of ['agendaList','workList']){const el=document.getElementById('filter_'+key);if(el)el.value=carmeliaDateFilters[key];}});
</script>

<script>
// Optional-file UI only. No storage or Firestore schema changes.
function carmeliaPreviewOptionalFile(input, previewId) {
 const preview=document.getElementById(previewId); const file=input.files&&input.files[0];
 preview.textContent='';
 if(!file){preview.textContent='Aucun fichier sélectionné (facultatif).';return;}
 const valid=['image/jpeg','image/png','application/pdf'].includes(file.type);
 if(!valid||file.size>5*1024*1024){input.value='';preview.textContent='Format accepté : JPG, PNG ou PDF (5 Mo maximum).';return;}
 const label=document.createElement('span');label.textContent=file.name+' ('+(file.size/1024/1024).toFixed(2)+' Mo)';preview.append(label);
 const link=document.createElement('a');link.textContent=' · Prévisualiser';link.href=URL.createObjectURL(file);link.target='_blank';link.rel='noopener noreferrer';preview.append(link);
 const remove=document.createElement('button');remove.type='button';remove.textContent=' Retirer';remove.style.marginLeft='10px';remove.onclick=()=>{URL.revokeObjectURL(link.href);input.value='';preview.textContent='Aucun fichier sélectionné (facultatif).'};preview.append(remove);
}
</script>

<script>
/* Optional attachment session: independent of the legacy Firestore UI login. */
async function carmeliaAttachmentLogin(role,id,pin){
 const r=await fetch('/api/attachments?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,id,pin})});
 if(!r.ok)throw Error('File authentication failed ('+r.status+')');
 const x=await r.json();sessionStorage.setItem('carmelia_attachment_token',x.token);
}
async function carmeliaUploadAttachment(file,docId){
 if(!file)return null;
 if(!['application/pdf','image/png','image/jpeg'].includes(file.type)||file.size>2500000)throw Error('PDF/JPG/PNG — maximum 2.5 MB (limite Vercel).');
 const token=sessionStorage.getItem('carmelia_attachment_token');if(!token)throw Error('Veuillez vous déconnecter et vous reconnecter pour joindre un fichier.');
 const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});
 const r=await fetch('/api/attachments?action=upload',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({docId,name:file.name,type:file.type,base64})});
 const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Upload failed ('+r.status+')');return x.attachment;
}
async function carmeliaOpenAttachment(docId){
 const token=sessionStorage.getItem('carmelia_attachment_token');if(!token)return alert('Veuillez vous déconnecter et vous reconnecter pour consulter le fichier.');
 const r=await fetch('/api/attachments?action=view&docId='+encodeURIComponent(docId),{headers:{Authorization:'Bearer '+token}});
 if(!r.ok)return alert('Fichier inaccessible. Reconnectez-vous.');const blob=await r.blob();const url=URL.createObjectURL(blob);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);
}
</script>

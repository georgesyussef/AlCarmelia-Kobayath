<style>
:root{--burg:#7b1238;--navy:#12365f;--gold:#d7ae45;--cream:#faf7ef;--ink:#172235;--muted:#718096;--line:#e6e9ef;--white:#fff;--danger:#b42318;--green:#16825d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f6f9;color:var(--ink)}
button,input,select,textarea{font:inherit}

.login-modal{position:fixed;inset:0;background:rgba(18,54,95,0.95);display:flex;align-items:center;justify-content:center;z-index:999;padding:15px}
.login-box{background:#fff;padding:35px 25px;border-radius:18px;width:min(400px,100%);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.2);position:relative}
.login-box img.logo{width: 220px; max-width: 80%; height: auto; object-fit: contain; margin-bottom: 15px;}
.login-box h2{margin:0 0 4px;color:var(--navy);font-size:22px}
.login-box p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
.login-box input{width:100%;padding:12px;border:1px solid #d8dde6;border-radius:10px;margin-bottom:12px;text-align:left;font-size:14px;outline:none}

.pw-wrap{position:relative;display:flex;align-items:center;margin-bottom:12px}
.pw-wrap input{margin-bottom:0!important;padding-right:40px!important}
.pw-toggle{position:absolute;right:12px;background:none;border:none;cursor:pointer;font-size:18px;padding:0;color:var(--muted)}

.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.btn-block{width:100%}
.primary{background:var(--burg);color:#fff}
.secondary{background:#eef2f7;color:var(--navy)}
.danger{background:#fff0ef;color:var(--danger)}

.container{max-width:950px;margin:0 auto;padding:20px 15px}
.header{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.header-brand{display:flex;align-items:center;gap:15px}
.header-brand img{width:55px;height:55px;object-fit:contain}
.header h1{margin:0;font-size:20px;color:var(--navy)}
.header p{margin:4px 0 0;color:var(--muted);font-size:13px}

.tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:5px}
.tab-btn{background:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--muted)}
.tab-btn.active{background:var(--burg);color:#fff;border-color:var(--burg)}

.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px;margin-bottom:15px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
.toolbar select,.toolbar input,.modal input,.modal select,.modal textarea{border:1px solid #d8dde6;border-radius:10px;padding:9px 12px;background:#fff;outline:none}

.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}
.table th{font-size:12px;color:var(--muted);text-transform:uppercase}
.table input[type="number"]{padding:6px;border:1px solid #d8dde6;border-radius:6px;text-align:center}

.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef3fa;color:var(--navy)}
.badge.red{background:#fde8e8;color:var(--danger)}
.empty{text-align:center;padding:30px;color:var(--muted)}

.modal-bg{display:none;position:fixed;inset:0;background:#10182899;z-index:20;align-items:center;justify-content:center;padding:18px}
.modal-bg.show{display:flex}
.modal{width:min(500px,100%);background:#fff;border-radius:18px;padding:22px}
.modal h3{margin:0 0 16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.lang-switcher {
  background: #f0f4f8;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  cursor: pointer;
  outline: none;
}

let db = {students:[], teachers:[], classes:[], subjects:[], agenda:[], announcements:[], attendance:{}, grades:{}};
let currentTeacher = null;

function togglePass(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (inp.type === "password") {
    inp.type = "text";
    btn.textContent = "🙈";
  } else {
    inp.type = "password";
    btn.textContent = "👁️";
  }
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openModal(title,body){modalTitle.textContent=title;modalContent.innerHTML=body;modalBg.classList.add('show')}
function closeModal(){modalBg.classList.remove('show')}

function loginTeacher() {
  const rawInput = document.getElementById('teacherIdInput').value.trim();
  const pin = document.getElementById('teacherPinInput').value.trim();

  if(!rawInput || !pin) return alert("Veuillez remplir tous les champs.");

  firestore.collection("school_data").doc("main").get().then((doc) => {
    if (doc.exists) {
      db = doc.data();
      const teacher = (db.teachers || []).find(t => 
        (t.id.toLowerCase() === rawInput.toLowerCase() || (t.email && t.email.toLowerCase() === rawInput.toLowerCase())) &&
        String(t.pin) === String(pin)
      );

      if (teacher) {
        sessionStorage.setItem('teacher_id', teacher.id.toUpperCase());
        currentTeacher = teacher;
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('teacherContent').style.display = 'block';
        renderTeacherData();
      } else {
        alert("Code Enseignant ou Code PIN incorrect!");
      }
    }
  }).catch(err => alert("Erreur: " + err.message));
}

function logoutTeacher() {
  sessionStorage.removeItem('teacher_id');
  currentTeacher = null;
  document.getElementById('loginModal').style.display = 'flex';
  document.getElementById('teacherContent').style.display = 'none';
  document.getElementById('teacherIdInput').value = '';
  document.getElementById('teacherPinInput').value = '';
}

firestore.collection("school_data").doc("main").onSnapshot((doc) => {
  if (doc.exists) {
    db = doc.data();
    const savedId = sessionStorage.getItem('teacher_id');
    if (savedId) {
      currentTeacher = (db.teachers || []).find(t => t.id.toUpperCase() === savedId.toUpperCase());
      if (currentTeacher) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('teacherContent').style.display = 'block';
        renderTeacherData();
      } else {
        logoutTeacher();
      }
    } else {
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('teacherContent').style.display = 'none';
    }
  }
});

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).style.display = 'block';
  btn.classList.add('active');
}

// Function to parse teacher subjects (e.g., "Français, Maths")
function getTeacherSubjects() {
  if (!currentTeacher || !currentTeacher.subject) return [];
  return currentTeacher.subject.split(/[,/]/).map(s => s.trim()).filter(Boolean);
}

function renderTeacherData() {
  if (!currentTeacher) return;
  const lang = localStorage.getItem('app_lang') || 'fr';
  const t = translations[lang] || translations.fr;

  document.getElementById('teacherNameDisplay').textContent = currentTeacher.name;
  document.getElementById('teacherSubjectDisplay').textContent = `${t.subjLabel} : ${currentTeacher.subject || '-'}`;

  const classOpts = (db.classes || []).map(c => `<option value="${esc(c.code)}">${esc(c.code)} - ${esc(c.name)}</option>`).join('');
  attClass.innerHTML = classOpts || '<option>Aucune classe</option>';
  gradeClass.innerHTML = classOpts || '<option>Aucune classe</option>';

  const teacherSubjs = getTeacherSubjects();
  let subjOpts = '';
  if (teacherSubjs.length === 0 || teacherSubjs.includes('TOUS')) {
    subjOpts = (db.subjects || []).map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
  } else {
    subjOpts = teacherSubjs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  }
  gradeSubject.innerHTML = subjOpts || '<option>Aucune matière</option>';

  if (!attDate.value) attDate.value = new Date().toISOString().split('T')[0];

  renderAttendance();
  renderGradesTable();
  renderAgenda();
  renderAnnouncements();
}

function renderAttendance() {
  if (!attClass || !attDate) return;
  const key = attDate.value + '|' + attClass.value;
  const rec = (db.attendance || {})[key] || {};
  const list = (db.students || []).filter(s => s.class === attClass.value);
  const lang = localStorage.getItem('app_lang') || 'fr';

  attendanceBody.innerHTML = list.map(s => `
    <tr>
      <td>${esc(s.id)}</td>
      <td><strong>${esc(s.name)}</strong></td>
      <td>
        <label style="margin-right:15px"><input type="radio" name="att_${s.id}" value="Present" ${(rec[s.id] || 'Present') === 'Present' ? 'checked' : ''}> ${lang === 'ar' ? 'حاضر' : 'Présent'}</label>
        <label><input type="radio" name="att_${s.id}" value="Absent" ${rec[s.id] === 'Absent' ? 'checked' : ''}> ${lang === 'ar' ? 'غائب' : 'Absent'}</label>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="3" class="empty">-</td></tr>';
}

function saveAttendance() {
  if (!db.attendance) db.attendance = {};
  const key = attDate.value + '|' + attClass.value;
  const rec = {};
  document.querySelectorAll('input[name^="att_"]:checked').forEach(r => {
    rec[r.name.replace('att_', '')] = r.value;
  });
  db.attendance[key] = rec;
  firestore.collection("school_data").doc("main").set(db);
  alert("Présence enregistrée avec succès!");
}

function renderGradesTable() {
  const selectedClass = gradeClass.value;
  const selectedSubj = gradeSubject.value;

  const list = (db.students || []).filter(s => s.class === selectedClass);

  gradesBody.innerHTML = list.map(s => {
    const studentGrades = (db.grades && db.grades[s.id]) ? db.grades[s.id] : [];
    const existing = studentGrades.find(g => g.subject === selectedSubj) || {};

    return `
      <tr>
        <td>${esc(s.id)}</td>
        <td><strong>${esc(s.name)}</strong></td>
        <td><input type="number" step="0.5" id="score_${s.id}" value="${esc(existing.score || '')}" style="width:70px"></td>
        <td><input type="number" id="max_${s.id}" value="${esc(existing.maxScore || 20)}" style="width:70px"></td>
        <td><input type="number" step="0.5" id="coef_${s.id}" value="${esc(existing.coef || 1)}" style="width:60px"></td>
        <td><input type="text" id="rem_${s.id}" value="${esc(existing.remark || '')}" style="width:100%"></td>
      </tr>
    `;
  }).join('') || '<tr><td colspan="6" class="empty">-</td></tr>';
}

function saveGrades() {
  const selectedClass = gradeClass.value;
  const selectedSubj = gradeSubject.value;

  if (!selectedSubj) return alert("Veuillez sélectionner une matière.");

  if (!db.grades) db.grades = {};

  const list = (db.students || []).filter(s => s.class === selectedClass);

  list.forEach(s => {
    const scoreVal = document.getElementById(`score_${s.id}`)?.value.trim();
    const maxVal = document.getElementById(`max_${s.id}`)?.value.trim() || '20';
    const coefVal = document.getElementById(`coef_${s.id}`)?.value.trim() || '1';
    const remVal = document.getElementById(`rem_${s.id}`)?.value.trim() || '';

    if (!db.grades[s.id]) db.grades[s.id] = [];

    const existingIdx = db.grades[s.id].findIndex(g => g.subject === selectedSubj);

    if (scoreVal !== "") {
      const gradeObj = {
        subject: selectedSubj,
        score: parseFloat(scoreVal),
        maxScore: parseFloat(maxVal),
        coef: parseFloat(coefVal),
        remark: remVal,
        teacher: currentTeacher ? currentTeacher.name : ''
      };

      if (existingIdx !== -1) {
        db.grades[s.id][existingIdx] = gradeObj;
      } else {
        db.grades[s.id].push(gradeObj);
      }
    } else if (existingIdx !== -1) {
      db.grades[s.id].splice(existingIdx, 1);
    }
  });

  firestore.collection("school_data").doc("main").set(db);
  alert("Notes sauvegardées avec succès!");
}

function renderAgenda() {
  const teacherSubjs = getTeacherSubjects();
  const list = (db.agenda || []).filter(a => 
    teacherSubjs.length === 0 || teacherSubjs.includes('TOUS') || teacherSubjs.includes(a.subject)
  );

  agendaList.innerHTML = list.map((a, i) => `
    <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)">
      <div>
        <strong>${esc(a.title)}</strong> <span class="badge">${esc(a.type)}</span>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(a.date)} · ${esc(a.class)} · ${esc(a.subject)}</div>
        <p style="margin:4px 0 0;font-size:13.5px">${esc(a.details || '')}</p>
      </div>
    </div>
  `).join('') || '<div class="empty">-</div>';
}

function openAgendaModal() {
  const teacherSubjs = getTeacherSubjects();
  let subjOptions = '';
  if (teacherSubjs.length === 0 || teacherSubjs.includes('TOUS')) {
    subjOptions = (db.subjects || []).map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
  } else {
    subjOptions = teacherSubjs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  }

  openModal('Ajouter Devoir', `
    <div class="formgrid">
      <div class="field"><label>Date</label><input type="date" id="ta_date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="field"><label>Classe</label><select id="ta_class">${(db.classes||[]).map(c=>`<option>${esc(c.code)}</option>`).join('')}</select></div>
      <div class="field"><label>Matière</label><select id="ta_subject">${subjOptions}</select></div>
      <div class="field"><label>Type</label><select id="ta_type"><option>Homework</option><option>Exam</option></select></div>
      <div class="field" style="grid-column:1/-1"><label>Titre</label><input id="ta_title"></div>
      <div class="field" style="grid-column:1/-1"><label>Détails</label><input id="ta_details"></div>
    </div>
    <div class="modal-actions"><button class="btn primary" onclick="saveAgendaFromTeacher()">Enregistrer</button></div>
  `);
}

function saveAgendaFromTeacher() {
  if (!db.agenda) db.agenda = [];
  const item = {
    date: ta_date.value,
    class: ta_class.value,
    subject: ta_subject.value,
    type: ta_type.value,
    title: ta_title.value.trim(),
    details: ta_details.value.trim()
  };
  db.agenda.push(item);
  firestore.collection("school_data").doc("main").set(db);
  closeModal();
  renderAgenda();

  fetch('https://api.webpushr.com/v1/notification/send/all', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apiKey': '16fffc156d1ee966b0a475bdcd5a1e56',
      'apiToken': '124444'
    },
    body: JSON.stringify({
      title: "📅 Devoir - " + item.class,
      message: item.subject + ": " + item.title,
      target_url: 'https://carmelia-school.firebaseapp.com/parents.html'
    })
  }).catch(e => console.error(e));
}

function renderAnnouncements() {
  const list = (db.announcements || []).filter(a => a.author === (currentTeacher ? currentTeacher.name : ''));

  annList.innerHTML = list.map(a => `
    <div style="padding:12px 0;border-bottom:1px solid var(--line)">
      <strong>${esc(a.title)}</strong> <span class="badge blue">${esc(a.target)}</span>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(a.date)}</div>
      <p style="margin:4px 0 0;font-size:13.5px">${esc(a.body)}</p>
    </div>
  `).join('') || '<div class="empty">-</div>';
}

function openAnnModal() {
  openModal('Publier une Remarque', `
    <div class="formgrid">
      <div class="field"><label>Date</label><input type="date" id="tann_date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="field"><label>Cible</label><select id="tann_target"><option value="All">Toute l'École</option>${(db.classes||[]).map(c=>`<option value="${esc(c.code)}">Classe: ${esc(c.code)}</option>`).join('')}${(db.students||[]).map(s=>`<option value="${esc(s.id)}">Élève: ${esc(s.name)} (${esc(s.id)})</option>`).join('')}</select></div>
      <div class="field" style="grid-column:1/-1"><label>Titre</label><input id="tann_title"></div>
      <div class="field" style="grid-column:1/-1"><label>Texte</label><textarea id="tann_body"></textarea></div>
    </div>
    <div class="modal-actions"><button class="btn primary" onclick="saveAnnFromTeacher()">Publier</button></div>
  `);
}

function saveAnnFromTeacher() {
  if (!db.announcements) db.announcements = [];
  const item = {
    date: tann_date.value,
    target: tann_target.value,
    title: tann_title.value.trim(),
    body: tann_body.value.trim(),
    author: currentTeacher ? currentTeacher.name : 'Enseignant'
  };
  db.announcements.push(item);
  firestore.collection("school_data").doc("main").set(db);
  closeModal();
  renderAnnouncements();
}

function changeTeacherPassword() {
  const oldP = document.getElementById('oldTeacherPin').value.trim();
  const newP = document.getElementById('newTeacherPin').value.trim();

  if (!oldP || !newP) return alert("Veuillez remplir tous les champs.");

  if (currentTeacher) {
    if (String(currentTeacher.pin) !== String(oldP)) {
      return alert("Ancien mot de passe incorrect.");
    }
    currentTeacher.pin = newP;
    const idx = db.teachers.findIndex(t => t.id === currentTeacher.id);
    if (idx !== -1) {
      db.teachers[idx].pin = newP;
      firestore.collection("school_data").doc("main").set(db);
    }
    alert("Mot de passe modifié avec succès!");
    document.getElementById('oldTeacherPin').value = '';
    document.getElementById('newTeacherPin').value = '';
  }
}

// Initial language load
const savedLang = localStorage.getItem('app_lang') || 'fr';
switchLanguage(savedLang);

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b1238">

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "39415e32-8162-42f3-9f04-8db482ea432e",

  });

<style>
:root{--burg:#7b1238;--navy:#12365f;--gold:#d7ae45;--cream:#faf7ef;--ink:#172235;--muted:#718096;--line:#e6e9ef;--white:#fff;--danger:#b42318;--green:#16825d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f6f9;color:var(--ink)}
button,input,select,textarea{font:inherit}

.login-modal{position:fixed;inset:0;background:rgba(18,54,95,0.95);display:flex;align-items:center;justify-content:center;z-index:999;padding:15px}
.login-box{background:#fff;padding:35px 25px;border-radius:18px;width:min(400px,100%);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.2);position:relative}
.login-box img.logo{width: 200px; max-width: 80%; height: auto; object-fit: contain; margin-bottom: 15px;}
.login-box h2{margin:0 0 4px;color:var(--navy);font-size:22px}
.login-box p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
.login-box input{width:100%;padding:12px;border:1px solid #d8dde6;border-radius:10px;margin-bottom:12px;outline:none;font-size:14px}

.pw-wrap{position:relative;display:flex;align-items:center;margin-bottom:12px}
.pw-wrap input{margin-bottom:0!important;padding-right:40px!important}
.pw-toggle{position:absolute;right:12px;background:none;border:none;cursor:pointer;font-size:18px;padding:0;color:var(--muted)}

.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.btn-block{width:100%}
.primary{background:var(--burg);color:#fff}
.secondary{background:#eef2f7;color:var(--navy)}
.danger{background:#fff0ef;color:var(--danger)}

.container{max-width:950px;margin:0 auto;padding:20px 15px}
.header{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.header-brand{display:flex;align-items:center;gap:15px}
.header-brand img{width:55px;height:55px;object-fit:contain}
.header h1{margin:0;font-size:20px;color:var(--navy)}
.header p{margin:4px 0 0;color:var(--muted);font-size:13px}

.tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:5px}
.tab-btn{background:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--muted)}
.tab-btn.active{background:var(--burg);color:#fff;border-color:var(--burg)}

.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px;margin-bottom:15px}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef3fa;color:var(--navy)}
.badge.green{background:#e8f7f0;color:var(--green)}
.badge.gold{background:#fbf5df;color:#7c5a00}
.empty{text-align:center;padding:30px;color:var(--muted)}

.modal-bg{display:none;position:fixed;inset:0;background:#10182899;z-index:20;align-items:center;justify-content:center;padding:18px}
.modal-bg.show{display:flex}
.modal{width:min(520px,100%);background:#fff;border-radius:18px;padding:22px}
.modal h3{margin:0 0 16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #d8dde6;border-radius:10px;padding:9px 12px;outline:none}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.lang-switcher {
  background: #f0f4f8;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  cursor: pointer;
  outline: none;
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loginModal" class="login-modal">
  <div class="login-box">
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <select class="lang-switcher" onchange="switchLanguage(this.value)">
        <option value="fr">🇫🇷 FR</option>
        <option value="ar">🇱🇧 AR</option>
        <option value="en">🇬🇧 EN</option>
      </select>
    </div>
    <img src="icon-192.png" alt="Logo Al Carmelia Kobayat" class="logo">
    <h2 id="loginTitle">Al Carmelia Kobayat</h2>
    <p id="loginSub">Espace Responsable du Cycle</p>
    <input type="text" id="respIdInput" placeholder="Code Responsable (Ex: R-001)">
    <div class="pw-wrap">
      <input type="password" id="respPinInput" placeholder="Code PIN (Mot de passe)">
      <button class="pw-toggle" type="button" onclick="togglePass('respPinInput', this)">👁️</button>
    </div>
    <button class="btn primary btn-block" id="loginBtn" onclick="loginResp()">Se Connecter</button>
  </div>
</div>

<div id="respContent" class="container" style="display:none">
  <header class="header">
    <div class="header-brand">
      <img src="icon-192.png" alt="Logo">
      <div>
        <h1 id="respNameDisplay">Responsable du Cycle</h1>
        <p id="respCycleDisplay">Cycle : -</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <select class="lang-switcher" onchange="switchLanguage(this.value)">
        <option value="fr">🇫🇷 FR</option>
        <option value="ar">🇱🇧 AR</option>
        <option value="en">🇬🇧 EN</option>
      </select>
      <button class="btn danger" id="logoutBtn" style="padding:8px 14px;font-size:12px" onclick="logoutResp()">Déconnexion</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" id="tabAgenda" onclick="switchTab('t_agenda', this)">📅 Agenda & Devoirs</button>
    <button class="tab-btn" id="tabWork" onclick="switchTab('t_work', this)">📖 Travail Quotidien (En classe)</button>
    <button class="tab-btn" id="tabSec" onclick="switchTab('t_security', this)">🔒 Mot de passe</button>
  </nav>

  <main>
    <div id="t_agenda" class="tab-content">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
          <h3 style="margin:0" id="agendaTitle">📅 Agenda & Devoirs du Cycle</h3>
          <button class="btn primary" id="addHomeworkBtn" onclick="openAgendaModal()">＋ Ajouter Devoir</button>
        </div>
        <div id="agendaList"></div>
      </div>
    </div>

    <div id="t_work" class="tab-content" style="display:none">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
          <h3 style="margin:0" id="workTitle">📖 Travail Quotidien du Cycle (En classe)</h3>
          <button class="btn primary" id="addWorkBtn" onclick="openWorkModal()">＋ Ajouter Travail Quotidien</button>
        </div>
        <div id="workList"></div>
      </div>
    </div>

    <div id="t_security" class="tab-content" style="display:none">
      <div class="card" style="max-width:400px;margin:0 auto">
        <h3 id="pwTitle">Changer le mot de passe</h3>
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px" id="lblOldPw">Ancien mot de passe</label>
          <div class="pw-wrap">
            <input type="password" id="oldRespPin" style="width:100%;padding:10px;border:1px solid #d8dde6;border-radius:10px">
            <button class="pw-toggle" type="button" onclick="togglePass('oldRespPin', this)">👁️</button>
          </div>
        </div>
        <div style="margin-bottom:15px">
          <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px" id="lblNewPw">Nouveau mot de passe</label>
          <div class="pw-wrap">
            <input type="password" id="newRespPin" style="width:100%;padding:10px;border:1px solid #d8dde6;border-radius:10px">
            <button class="pw-toggle" type="button" onclick="togglePass('newRespPin', this)">👁️</button>
          </div>
        </div>
        <button class="btn primary btn-block" id="btnChangePw" onclick="changeRespPassword()">Changer le mot de passe</button>
      </div>
    </div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal"><h3 id="modalTitle"></h3><div id="modalContent"></div></div></div>

<script>
const translations = {

    addHomeworkBtn: "＋ إضافة فرض",
    workTitle: "📖 العمل اليومي في الصف للمرحلة",
    addWorkBtn: "＋ إضافة عمل يومي",
    pwTitle: "تغيير كلمة السر",
    lblOldPw: "كلمة السر القديمة",
    lblNewPw: "كلمة السر الجديدة",
    btnChangePw: "تغيير كلمة السر",
    cycleLabel: "المرحلة"
  },
  en: {
    loginTitle: "Al Carmelia Kobayat",
    loginSub: "Cycle Supervisor Portal",
    idPlaceholder: "Supervisor ID (e.g. R-001)",
    pinPlaceholder: "PIN Code (Password)",
    loginBtn: "Login",
    logoutBtn: "Logout",
    tabAgenda: "📅 Agenda & Homework",
    tabWork: "📖 Class Daily Work",

    agendaTitle: "📅 Cycle Agenda & Homework",
    addHomeworkBtn: "＋ Add Homework",
    workTitle: "📖 Cycle Daily Classwork",
    addWorkBtn: "＋ Add Daily Classwork",
    pwTitle: "Change Password",
    lblOldPw: "Old Password",
    lblNewPw: "New Password",
    btnChangePw: "Change Password",
    cycleLabel: "Cycle"
  }
};

function setText(id, text) {
  const el = document.getElementById(id);
  if (el && text !== undefined) el.innerText = text;
}

function setPlaceholder(id, text) {
  const el = document.getElementById(id);
  if (el && text !== undefined) el.placeholder = text;
}

function switchLanguage(lang) {
  localStorage.setItem('app_lang', lang);
  const t = translations[lang] || translations.fr;
  document.getElementById('htmlRoot').dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('htmlRoot').lang = lang;

  document.querySelectorAll('.lang-switcher').forEach(s => s.value = lang);

  setText('loginTitle', t.loginTitle);
  setText('loginSub', t.loginSub);
  setPlaceholder('respIdInput', t.idPlaceholder);
  setPlaceholder('respPinInput', t.pinPlaceholder);
  setText('loginBtn', t.loginBtn);
  setText('logoutBtn', t.logoutBtn);

  setText('tabAgenda', t.tabAgenda);
  setText('tabWork', t.tabWork);
  setText('tabSec', t.tabSec);

  setText('agendaTitle', t.agendaTitle);
  setText('addHomeworkBtn', t.addHomeworkBtn);
  setText('workTitle', t.workTitle);
  setText('addWorkBtn', t.addWorkBtn);

  setText('pwTitle', t.pwTitle);
  setText('lblOldPw', t.lblOldPw);
  setText('lblNewPw', t.lblNewPw);
  setText('btnChangePw', t.btnChangePw);

  if (currentResp) renderRespData();
}

const firebaseConfig = {
  apiKey: "AIzaSyDJRfis99yy8m9Z7pIHkw3U2i0jUqLXBec",
  authDomain: "carmelia-school.firebaseapp.com",
  projectId: "carmelia-school",
  storageBucket: "carmelia-school.firebasestorage.app",
  messagingSenderId: "710304409299",
  appId: "1:710304409299:web:44c4c109d432a6e3ba1626",
  measurementId: "G-E470YHZM0K"
};

firebase.initializeApp(firebaseConfig);
const firestore = firebase.firestore();

let db = {students:[], teachers:[], responsables:[], classes:[], subjects:[], agenda:[], travail_quotidien:[]};
let currentResp = null;

function sendPushNotification(title, message) {
  fetch('https://onesignal.com/api/v1/notifications', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json; charset=utf-8',
      'Authorization': 'Basic os_v2_app_hfav4mubmjbphhyerw2if2sdf2pqxnjukarevfutjork3shluyqoc4evnxlacqmknzhkrypabrqmr7fqf22s3gfszinao3rqiudg5oa'
    },
    body: JSON.stringify({
      app_id: "39415e32-8162-42f3-9f04-8db482ea432e",
      included_segments: ["Total Subscriptions"],
      headings: { "en": title, "fr": title, "ar": title },
      contents: { "en": message, "fr": message, "ar": message },
      url: "https://carmelia-school.firebaseapp.com/parents.html"
    })
  })
  .then(res => res.json())
  .then(data => console.log('OneSignal Push Sent:', data))
  .catch(err => console.error('OneSignal Error:', err));
}

function togglePass(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (inp) {
    if (inp.type === "password") {
      inp.type = "text";
      btn.textContent = "🙈";
    } else {
      inp.type = "password";
      btn.textContent = "👁️";
    }
  }
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function openModal(title, body){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalContent').innerHTML = body;
  document.getElementById('modalBg').classList.add('show');
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
}

function loginResp() {
  const rawInput = document.getElementById('respIdInput').value.trim();
  const pin = document.getElementById('respPinInput').value.trim();

  if(!rawInput || !pin) {
    alert(localStorage.getItem('app_lang') === 'ar' ? "الرجاء تعبئة جميع الحقول." : "Veuillez remplir tous les champs.");
    return;
  }

  firestore.collection("school_data").doc("main").get().then((doc) => {
    if (doc.exists) {
      db = doc.data();
      const resp = (db.responsables || []).find(r => 
        (r.id && r.id.toString().trim().toLowerCase() === rawInput.toLowerCase()) &&
        String(r.pin) === String(pin)
      );

      if (resp) {
        sessionStorage.setItem('resp_id', resp.id);
        currentResp = resp;
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('respContent').style.display = 'block';
        renderRespData();
      } else {
        alert(localStorage.getItem('app_lang') === 'ar' ? "رمز المسؤول أو كلمة السر غير صحيحة!" : "ID Responsable ou Code PIN incorrect!");
      }
    }
  }).catch(err => alert("Erreur: " + err.message));
}

function logoutResp() {
  sessionStorage.removeItem('resp_id');
  currentResp = null;
  document.getElementById('loginModal').style.display = 'flex';
  document.getElementById('respContent').style.display = 'none';
  document.getElementById('respIdInput').value = '';
  document.getElementById('respPinInput').value = '';
}

firestore.collection("school_data").doc("main").onSnapshot((doc) => {
  if (doc.exists) {
    db = doc.data();
    const savedId = sessionStorage.getItem('resp_id');
    if (savedId) {
      currentResp = (db.responsables || []).find(r => r.id === savedId);
      if (currentResp) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('respContent').style.display = 'block';
        renderRespData();
      } else {
        logoutResp();
      }
    } else {
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('respContent').style.display = 'none';
    }
  }
});

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).style.display = 'block';
  btn.classList.add('active');
}

function getRespClasses() {
  if (!db.classes) return [];
  if (!currentResp || currentResp.cycle === 'TOUS') return db.classes;
  return db.classes.filter(c => c.level === currentResp.cycle);
}

function renderRespData() {
  if (!currentResp) return;
  const lang = localStorage.getItem('app_lang') || 'fr';
  const t = translations[lang] || translations.fr;

  document.getElementById('respNameDisplay').textContent = currentResp.name;
  document.getElementById('respCycleDisplay').textContent = `${t.cycleLabel} : ${currentResp.cycle || 'TOUS'}`;

  const validClasses = getRespClasses().map(c => c.code);

  const cycleAgenda = (db.agenda || []).filter(a => validClasses.includes(a.class));
  document.getElementById('agendaList').innerHTML = cycleAgenda.slice().reverse().map((a) => {
    const realIndex = db.agenda.indexOf(a);
    return `
      <div style="display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)">
        <div>
          <strong>${esc(a.title)}</strong> <span class="badge">${esc(a.type || 'Devoir')}</span>
          <div class="muted" style="font-size:12px;margin-top:3px">${esc(a.date)} · Classe: <strong>${esc(a.class)}</strong> · ${esc(a.subject)}${a.teacher ? ' · Prof: ' + esc(a.teacher) : ''}</div>
          <div style="margin-top:5px;white-space:pre-wrap">${esc(a.details || '')}</div>
        </div>
        <div>
          <button class="btn danger" style="padding:6px 10px;font-size:12px" onclick="deleteAgendaItem(${realIndex})">Supprimer</button>
        </div>
      </div>
    `;
  }).join('') || '<div class="empty">Aucun devoir publié pour ce cycle.</div>';

  const cycleWork = (db.travail_quotidien || []).filter(w => validClasses.includes(w.class));
  document.getElementById('workList').innerHTML = cycleWork.slice().reverse().map((w) => {
    const realIndex = db.travail_quotidien.indexOf(w);
    return `
      <div style="display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)">
        <div>
          <strong>${esc(w.title || 'Travail en classe')}</strong> <span class="badge green">${esc(w.subject)}</span>
          <div class="muted" style="font-size:12px;margin-top:3px">${esc(w.date)} · Classe: <strong>${esc(w.class)}</strong>${w.teacher ? ' · Prof: ' + esc(w.teacher) : ''}</div>
          <div style="margin-top:5px;white-space:pre-wrap">${esc(w.details || '')}</div>
        </div>
        <div>
          <button class="btn danger" style="padding:6px 10px;font-size:12px" onclick="deleteWorkItem(${realIndex})">Supprimer</button>
        </div>
      </div>
    `;
  }).join('') || '<div class="empty">Aucun travail quotidien publié pour ce cycle.</div>';
}

function openAgendaModal() {
  const respClasses = getRespClasses();
  if (!respClasses.length) return alert("Aucune classe disponible pour votre cycle.");

  openModal('Ajouter Devoir', `
    <div class="formgrid">
      <div class="field"><label>Date</label><input type="date" id="ra_date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="field"><label>Classe</label><select id="ra_class">${respClasses.map(c => `<option>${esc(c.code)}</option>`).join('')}</select></div>
      <div class="field"><label>Matière</label><select id="ra_subject">${(db.subjects || []).map(s => `<option>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Type</label><select id="ra_type"><option>Homework</option><option>Exam</option></select></div>
      <div class="field" style="grid-column:1/-1"><label>Titre</label><input id="ra_title"></div>
      <div class="field" style="grid-column:1/-1"><label>Détails</label><textarea id="ra_details" rows="3"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Annuler</button>
      <button class="btn primary" onclick="saveRespAgenda()">Enregistrer</button>
    </div>
  `);
}

function saveRespAgenda() {
  if (!db.agenda) db.agenda = [];
  const newItem = {
    date: ra_date.value,
    class: ra_class.value,
    subject: ra_subject.value,
    type: ra_type.value,
    title: ra_title.value.trim(),
    details: ra_details.value.trim(),
    teacher: currentResp.name + " (Responsable)"
  };
  
  if (!newItem.title) return alert("Veuillez saisir un titre.");

  db.agenda.push(newItem);
  firestore.collection("school_data").doc("main").set(db);
  closeModal();
  sendPushNotification("📅 Devoir - " + newItem.class, newItem.subject + ": " + newItem.title);
}

function deleteAgendaItem(index) {
  if (confirm("Voulez-vous supprimer ce devoir ?")) {
    db.agenda.splice(index, 1);
    firestore.collection("school_data").doc("main").set(db);
  }
}

function openWorkModal() {
  const respClasses = getRespClasses();
  if (!respClasses.length) return alert("Aucune classe disponible pour votre cycle.");

  openModal('Ajouter Travail Quotidien', `
    <div class="formgrid">
      <div class="field"><label>Date</label><input type="date" id="rw_date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="field"><label>Classe</label><select id="rw_class">${respClasses.map(c => `<option>${esc(c.code)}</option>`).join('')}</select></div>
      <div class="field" style="grid-column:1/-1"><label>Matière</label><select id="rw_subject">${(db.subjects || []).map(s => `<option>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field" style="grid-column:1/-1"><label>Titre / Chapitre</label><input id="rw_title"></div>
      <div class="field" style="grid-column:1/-1"><label>Détails du travail</label><textarea id="rw_details" rows="3"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Annuler</button>
      <button class="btn primary" onclick="saveRespWork()">Enregistrer</button>
    </div>
  `);
}

function saveRespWork() {
  if (!db.travail_quotidien) db.travail_quotidien = [];
  const newItem = {
    date: rw_date.value,
    class: rw_class.value,
    subject: rw_subject.value,
    title: rw_title.value.trim(),
    details: rw_details.value.trim(),
    teacher: currentResp.name + " (Responsable)"
  };

  if (!newItem.title) return alert("Veuillez saisir un titre.");

  db.travail_quotidien.push(newItem);
  firestore.collection("school_data").doc("main").set(db);
  closeModal();
  sendPushNotification("📖 Travail Quotidien - " + newItem.class, newItem.subject + ": " + newItem.title);
}

function deleteWorkItem(index) {
  if (confirm("Voulez-vous supprimer ce travail quotidien ?")) {
    db.travail_quotidien.splice(index, 1);
    firestore.collection("school_data").doc("main").set(db);
  }
}

function changeRespPassword() {
  const oldP = document.getElementById('oldRespPin').value.trim();
  const newP = document.getElementById('newRespPin').value.trim();

  if (!oldP || !newP) return alert("Veuillez remplir tous les champs.");

  if (currentResp) {
    if (String(currentResp.pin) !== String(oldP)) {
      return alert("Ancien mot de passe incorrect.");
    }
    currentResp.pin = newP;
    const idx = db.responsables.findIndex(r => r.id === currentResp.id);
    if (idx !== -1) {
      db.responsables[idx].pin = newP;
      firestore.collection("school_data").doc("main").set(db);
    }
    alert("Mot de passe modifié avec succès!");
    document.getElementById('oldRespPin').value = '';
    document.getElementById('newRespPin').value = '';
  }
}

const savedLang = localStorage.getItem('app_lang') || 'fr';
switchLanguage(savedLang);
</script>

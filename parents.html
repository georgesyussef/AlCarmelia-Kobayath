<!doctype html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Carmelia Kobayat · Espace Parents</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b1238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Al Carmelia">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- OneSignal Tracking SDK -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "39415e32-8162-42f3-9f04-8db482ea432e",
    });
  });
</script>

<style>
:root{--burg:#7b1238;--navy:#12365f;--gold:#d7ae45;--cream:#faf7ef;--ink:#172235;--muted:#718096;--line:#e6e9ef;--white:#fff;--danger:#b42318;--green:#16825d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f6f9;color:var(--ink)}
button,input,select{font:inherit}

.login-modal{position:fixed;inset:0;background:rgba(18,54,95,0.95);display:flex;align-items:center;justify-content:center;z-index:999;padding:15px}
.login-box{background:#fff;padding:35px 25px;border-radius:18px;width:min(400px,100%);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.2);position:relative}
.login-box img.logo{width: 220px; max-width: 80%; height: auto; object-fit: contain; margin-bottom: 15px;}
.login-box h2{margin:0 0 4px;color:var(--navy);font-size:22px}
.login-box p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
.login-box input{width:100%;padding:12px;border:1px solid #d8dde6;border-radius:10px;margin-bottom:12px;text-align:left;font-size:14px;outline:none}

.pw-wrap{position:relative;display:flex;align-items:center;margin-bottom:12px}
.pw-wrap input{margin-bottom:0!important;padding-right:40px!important}
.pw-toggle{position:absolute;right:12px;background:none;border:none;cursor:pointer;font-size:18px;padding:0;color:var(--muted)}

.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;width:100%}
.primary{background:var(--burg);color:#fff}

.container{max-width:900px;margin:0 auto;padding:20px 15px}
.header{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.header-brand{display:flex;align-items:center;gap:15px}
.header-brand img{width:55px;height:55px;object-fit:contain}
.header h1{margin:0;font-size:20px;color:var(--navy)}
.header p{margin:4px 0 0;color:var(--muted);font-size:13px}

.tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:5px}
.tab-btn{background:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--muted)}
.tab-btn.active{background:var(--burg);color:#fff;border-color:var(--burg)}

.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px;margin-bottom:15px}
.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef3fa;color:var(--navy)}
.badge.green{background:#e8f7f0;color:var(--green)}
.empty{text-align:center;padding:30px;color:var(--muted)}

.lang-switcher {
  background: #f0f4f8;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  cursor: pointer;
  outline: none;
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loginModal" class="login-modal">
  <div class="login-box">
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <select class="lang-switcher" onchange="switchLanguage(this.value)">
        <option value="fr">🇫🇷 FR</option>
        <option value="ar">🇱🇧 AR</option>
        <option value="en">🇬🇧 EN</option>
      </select>
    </div>
    <img src="icon-192.png" alt="Logo Al Carmelia Kobayat" class="logo">
    <h2 id="loginTitle">Al Carmelia Kobayat</h2>
    <p id="loginSub">Accès Espace Parents & Élèves</p>
    <input type="text" id="studentIdInput" placeholder="ID Élève (Ex: ST-0001)">
    <div class="pw-wrap">
      <input type="password" id="studentPinInput" placeholder="Code PIN (Mot de passe)">
      <button class="pw-toggle" type="button" onclick="togglePass('studentPinInput', this)">👁️</button>
    </div>
    <button class="btn primary" id="loginBtn" onclick="loginStudent()">Se Connecter</button>
    <button class="btn notif-toggle-btn" style="background:var(--navy);color:#fff;margin-top:10px;" onclick="enableAppNotifications()">🔔 Activer les notifications</button>
  </div>
</div>

<div id="parentContent" class="container" style="display:none">
  <div id="iosNotice" style="display:none; background:#fff3cd; color:#856404; padding:12px; border-radius:10px; margin-bottom:15px; border:1px solid #ffeeba; font-size:13px; text-align:center;">
    📲 <strong>Lal-Ahil (iPhone Users):</strong> La-yusalak notifications l-devoirs, e3mel 📤 <em>Partager</em> -> ➕ <em>Sur l'écran d'accueil</em> bil-Safari.
  </div>

  <header class="header">
    <div class="header-brand">
      <img src="icon-192.png" alt="Logo">
      <div>
        <h1 id="studentNameDisplay">Élève</h1>
        <p id="studentClassDisplay">Classe : -</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="btn notif-toggle-btn" style="background:var(--navy);color:#fff;width:auto;padding:8px 14px;font-size:12px;" onclick="enableAppNotifications()">🔔 Activer les notifications</button>
      <select class="lang-switcher" onchange="switchLanguage(this.value)">
        <option value="fr">🇫🇷 FR</option>
        <option value="ar">🇱🇧 AR</option>
        <option value="en">🇬🇧 EN</option>
      </select>
      <button class="btn primary" id="logoutBtn" style="width:auto;padding:8px 14px;font-size:12px" onclick="logoutStudent()">Déconnexion</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" id="tabAgenda" onclick="switchTab('t_agenda', this)">📅 Agenda & Devoirs</button>
    <button class="tab-btn" id="tabWork" onclick="switchTab('t_work', this)">📖 Travail Quotidien (En classe)</button>
    <button class="tab-btn" id="tabSec" onclick="switchTab('t_security', this)">🔒 Mot de passe</button>
  </nav>

  <main>
    <div id="t_agenda" class="tab-content">
      <div class="card">
        <h3 id="agendaHeader">📅 Agenda & Devoirs à la maison</h3>
        <div id="agendaList"></div>
      </div>
    </div>

    <div id="t_work" class="tab-content" style="display:none">
      <div class="card">
        <h3 id="workHeader">📖 Travail Quotidien effectué en classe</h3>
        <div id="workList"></div>
      </div>
    </div>

    <div id="t_security" class="tab-content" style="display:none">
      <div class="card" style="max-width:400px;margin:0 auto">
        <h3 id="pwTitle">Changer le mot de passe</h3>
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px" id="lblOldPw">Ancien mot de passe</label>
          <div class="pw-wrap">
            <input type="password" id="oldPin" style="width:100%;padding:10px;border:1px solid #d8dde6;border-radius:10px">
            <button class="pw-toggle" type="button" onclick="togglePass('oldPin', this)">👁️</button>
          </div>
        </div>
        <div style="margin-bottom:15px">
          <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px" id="lblNewPw">Nouveau mot de passe</label>
          <div class="pw-wrap">
            <input type="password" id="newPin" style="width:100%;padding:10px;border:1px solid #d8dde6;border-radius:10px">
            <button class="pw-toggle" type="button" onclick="togglePass('newPin', this)">👁️</button>
          </div>
        </div>
        <button class="btn primary" id="btnChangePw" onclick="changeParentPassword()">Changer le mot de passe</button>
      </div>
    </div>
  </main>
</div>

<script>
const translations = {
  fr: {
    loginTitle: "Al Carmelia Kobayat",
    loginSub: "Accès Espace Parents & Élèves",
    idPlaceholder: "ID Élève (Ex: ST-0001)",
    pinPlaceholder: "Code PIN (Mot de passe)",
    loginBtn: "Se Connecter",
    logoutBtn: "Déconnexion",
    tabAgenda: "📅 Agenda & Devoirs",
    tabWork: "📖 Travail Quotidien (En classe)",
    tabSec: "🔒 Mot de passe",
    agendaHeader: "📅 Agenda & Devoirs à la maison",
    workHeader: "📖 Travail Quotidien effectué en classe",
    pwTitle: "Changer le mot de passe",
    lblOldPw: "Ancien mot de passe",
    lblNewPw: "Nouveau mot de passe",
    btnChangePw: "Changer le mot de passe",
    classLabel: "Classe",
    idLabel: "ID",
    btnNotif: "🔔 Activer les notifications",
    notifNotSupported: "Ce navigateur ne prend pas en charge les notifications.",
    notifSuccess: "✅ Notifications activées avec succès !",
    notifBlocked: "⚠️ Les notifications sont bloquées dans les paramètres du navigateur."
  },
  ar: {
    loginTitle: "الكرملية القبيات",
    loginSub: "بوابة الأهل والطلاب",
    idPlaceholder: "رمز الطالب (مثال: ST-0001)",
    pinPlaceholder: "رمز البين / كلمة السر",
    loginBtn: "تسجيل الدخول",
    logoutBtn: "تسجيل الخروج",
    tabAgenda: "📅 المفكرة والفرض المدرسي",
    tabWork: "📖 العمل اليومي في الصف",
    tabSec: "🔒 كلمة السر",
    agendaHeader: "📅 المفكرة والفرض المنزلي",
    workHeader: "📖 ما تم إنجازه اليوم داخل الصف",
    pwTitle: "تغيير كلمة السر",
    lblOldPw: "كلمة السر القديمة",
    lblNewPw: "كلمة السر الجديدة",
    btnChangePw: "تغيير كلمة السر",
    classLabel: "الصف",
    idLabel: "الرمز",
    btnNotif: "🔔 تفعيل الإشعارات",
    notifNotSupported: "هذا المتصفح لا يدعم الإشعارات.",
    notifSuccess: "✅ تم تفعيل الإشعارات بنجاح!",
    notifBlocked: "⚠️ الإشعارات محظورة في إعدادات المتصفح."
  },
  en: {
    loginTitle: "Al Carmelia Kobayat",
    loginSub: "Parents & Students Portal",
    idPlaceholder: "Student ID (e.g. ST-0001)",
    pinPlaceholder: "PIN Code (Password)",
    loginBtn: "Login",
    logoutBtn: "Logout",
    tabAgenda: "📅 Agenda & Homework",
    tabWork: "📖 Class Daily Work",
    tabSec: "🔒 Password",
    agendaHeader: "📅 Agenda & Homework",
    workHeader: "📖 Daily Classwork completed in class",
    pwTitle: "Change Password",
    lblOldPw: "Old Password",
    lblNewPw: "New Password",
    btnChangePw: "Change Password",
    classLabel: "Class",
    idLabel: "ID",
    btnNotif: "🔔 Enable Notifications",
    notifNotSupported: "This browser does not support notifications.",
    notifSuccess: "✅ Notifications enabled successfully!",
    notifBlocked: "⚠️ Notifications are blocked in browser settings."
  }
};

function switchLanguage(lang) {
  localStorage.setItem('app_lang', lang);
  const t = translations[lang] || translations.fr;
  document.getElementById('htmlRoot').dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('htmlRoot').lang = lang;

  document.querySelectorAll('.lang-switcher').forEach(s => s.value = lang);

  document.getElementById('loginTitle').innerText = t.loginTitle;
  document.getElementById('loginSub').innerText = t.loginSub;
  document.getElementById('studentIdInput').placeholder = t.idPlaceholder;
  document.getElementById('studentPinInput').placeholder = t.pinPlaceholder;
  document.getElementById('loginBtn').innerText = t.loginBtn;
  document.getElementById('logoutBtn').innerText = t.logoutBtn;

  document.querySelectorAll('.notif-toggle-btn').forEach(b => b.innerText = t.btnNotif);

  document.getElementById('tabAgenda').innerText = t.tabAgenda;
  document.getElementById('tabWork').innerText = t.tabWork;
  document.getElementById('tabSec').innerText = t.tabSec;

  document.getElementById('agendaHeader').innerText = t.agendaHeader;
  document.getElementById('workHeader').innerText = t.workHeader;
  document.getElementById('pwTitle').innerText = t.pwTitle;
  document.getElementById('lblOldPw').innerText = t.lblOldPw;
  document.getElementById('lblNewPw').innerText = t.lblNewPw;
  document.getElementById('btnChangePw').innerText = t.btnChangePw;

  if (currentStudent) renderParentData();
}

function enableAppNotifications() {
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

  if (isIOS && !isStandalone) {
    alert("📲 La-yusalak notifications 3al iPhone:\n\n1. E3mel 'Partager' (📤) bi-asfal Safari.\n2. Khaiyyar 'Sur l'écran d'accueil' (➕).\n3. Ifta7 l-app min l-chache l-asasiye w fa33el l-notifications.");
    return;
  }

  if (window.OneSignalDeferred) {
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.Notifications.requestPermission();
      alert("✅ Notifications mfa33ale bi-naja7!");
    });
  }
}

function checkNotifPermission() {
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  
  const iosNotice = document.getElementById('iosNotice');
  if (iosNotice) {
    if (isIOS && !isStandalone) {
      iosNotice.style.display = 'block';
    } else {
      iosNotice.style.display = 'none';
    }
  }
}

const firebaseConfig = {
  apiKey: "AIzaSyDJRfis99yy8m9Z7pIHkw3U2i0jUqLXBec",
  authDomain: "carmelia-school.firebaseapp.com",
  projectId: "carmelia-school",
  storageBucket: "carmelia-school.firebasestorage.app",
  messagingSenderId: "710304409299",
  appId: "1:710304409299:web:44c4c109d432a6e3ba1626",
  measurementId: "G-E470YHZM0K"
};

firebase.initializeApp(firebaseConfig);
const firestore = firebase.firestore();

let db = {students:[], classes:[], subjects:[], agenda:[], travail_quotidien:[]};
let currentStudent = null;

function togglePass(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (inp.type === "password") {
    inp.type = "text";
    btn.textContent = "🙈";
  } else {
    inp.type = "password";
    btn.textContent = "👁️";
  }
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function loginStudent() {
  const rawInput = document.getElementById('studentIdInput').value.trim();
  const pin = document.getElementById('studentPinInput').value.trim();

  if(!rawInput || !pin) return alert("Veuillez remplir tous les champs.");

  firestore.collection("school_data").doc("main").get().then((doc) => {
    if (doc.exists) {
      db = doc.data();
      const student = (db.students || []).find(s => 
        (s.id.toLowerCase() === rawInput.toLowerCase() || (s.email && s.email.toLowerCase() === rawInput.toLowerCase())) &&
        String(s.pin) === String(pin)
      );

      if (student) {
        sessionStorage.setItem('parent_student_id', student.id.toUpperCase());
        currentStudent = student;
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('parentContent').style.display = 'block';
        renderParentData();
      } else {
        alert("ID Élève ou Code PIN incorrect!");
      }
    }
  }).catch(err => alert("Erreur: " + err.message));
}

function logoutStudent() {
  sessionStorage.removeItem('parent_student_id');
  currentStudent = null;
  document.getElementById('loginModal').style.display = 'flex';
  document.getElementById('parentContent').style.display = 'none';
  document.getElementById('studentIdInput').value = '';
  document.getElementById('studentPinInput').value = '';
  checkNotifPermission();
}

firestore.collection("school_data").doc("main").onSnapshot((doc) => {
  if (doc.exists) {
    db = doc.data();

    const savedId = sessionStorage.getItem('parent_student_id');
    if (savedId) {
      currentStudent = (db.students || []).find(s => s.id.toUpperCase() === savedId.toUpperCase());
      if (currentStudent) {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('parentContent').style.display = 'block';
        renderParentData();
      } else {
        logoutStudent();
      }
    } else {
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('parentContent').style.display = 'none';
    }
  }
});

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).style.display = 'block';
  btn.classList.add('active');
}

function renderParentData() {
  if (!currentStudent) return;
  const lang = localStorage.getItem('app_lang') || 'fr';
  const t = translations[lang] || translations.fr;

  try {
    if (window.OneSignalDeferred) {
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.User.addTags({
          'role': 'parent',
          'classe': currentStudent.class || '',
          'student_id': currentStudent.id || ''
        });
      });
    }
  } catch (e) {
    console.warn("OneSignal tag error:", e);
  }

  document.getElementById('studentNameDisplay').textContent = currentStudent.name;
  document.getElementById('studentClassDisplay').textContent = `${t.classLabel} : ${currentStudent.class} · ${t.idLabel} : ${currentStudent.id}`;

  const studentAgenda = (db.agenda || []).filter(a => a.class === currentStudent.class);
  agendaList.innerHTML = studentAgenda.slice().reverse().map(a => `
    <div style="padding:14px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>${esc(a.title)}</strong> 
        <span class="badge">${esc(a.type || 'Devoir')}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(a.date)} · ${esc(a.subject)}${a.teacher ? ' · Prof: ' + esc(a.teacher) : ''}</div>
      <p style="margin:8px 0 0;font-size:14px;line-height:1.4;white-space:pre-wrap">${esc(a.details || '')}</p>
    </div>
  `).join('') || '<div class="empty">Aucun devoir enregistré pour le moment.</div>';

  const studentWork = (db.travail_quotidien || []).filter(w => w.class === currentStudent.class);
  workList.innerHTML = studentWork.slice().reverse().map(w => `
    <div style="padding:14px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong style="color:var(--navy);font-size:15px">${esc(w.title || 'Travail en classe')}</strong>
        <span class="badge green">${esc(w.subject)}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">📅 ${esc(w.date)}${w.teacher ? ' · Enseignant: ' + esc(w.teacher) : ''}</div>
      <p style="margin:8px 0 0;font-size:14px;line-height:1.4;white-space:pre-wrap">${esc(w.details || '')}</p>
    </div>
  `).join('') || '<div class="empty">Aucun travail quotidien enregistré pour le moment.</div>';
}

function changeParentPassword() {
  const oldP = document.getElementById('oldPin').value.trim();
  const newP = document.getElementById('newPin').value.trim();

  if (!oldP || !newP) return alert("Veuillez remplir tous les champs.");

  if (currentStudent) {
    if (String(currentStudent.pin) !== String(oldP)) {
      return alert("Ancien mot de passe incorrect.");
    }
    currentStudent.pin = newP;
    const idx = db.students.findIndex(s => s.id === currentStudent.id);
    if (idx !== -1) {
      db.students[idx].pin = newP;
      firestore.collection("school_data").doc("main").set(db);
    }
    alert("Mot de passe modifié avec succès!");
    document.getElementById('oldPin').value = '';
    document.getElementById('newPin').value = '';
  }
}

const savedLang = localStorage.getItem('app_lang') || 'fr';
switchLanguage(savedLang);
checkNotifPermission();
</script>
</body>
</html>
